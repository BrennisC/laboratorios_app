services:
  app:
    build:
      context: "./web vulnerable"
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: vulnshop_db
      DB_USER: web_app
      DB_PASS: secureshop_pass123
    volumes:
      - "./web vulnerable:/var/www/html"
      - vulnshop_data:/var/www/html/data
      - vulnshop_uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "./web vulnerable/postgresql_setup.sql:/docker-entrypoint-initdb.d/01-vulnshop.sql:ro"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  vulnshop_data:
  vulnshop_uploads:
