ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost:8443/
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/secureshop.crt
    SSLCertificateKeyFile /etc/apache2/ssl/secureshop.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/storage>
        php_admin_flag engine off
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/secureshop_error.log
    CustomLog ${APACHE_LOG_DIR}/secureshop_access.log combined
</VirtualHost>
